<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Spatial Statistics — Course Materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-hover: #f8fafc;
            --bg-active: #f1f5f9;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --sidebar-width: 270px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .portal-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Minimal White Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            user-select: none;
            transition: transform 0.25s ease;
        }

        .sidebar-header {
            padding: 24px 20px 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .course-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .course-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* Navigation Links */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .nav-category {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            padding: 10px 10px 6px 10px;
            margin-top: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            gap: 10px;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
        }

        .nav-icon {
            font-size: 15px;
            opacity: 0.9;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
        }

        /* Main Content Viewport (Full Screen, Minimal Header) */
        .content-pane {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .mobile-header {
            display: none;
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            align-items: center;
            padding: 0 14px;
            gap: 12px;
            z-index: 10;
        }

        .menu-toggle {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .mobile-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Frame Viewport: 100% Height */
        .iframe-wrap {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #ffffff;
            position: relative;
        }

        .view-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #ffffff;
        }

        /* Mobile Overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            z-index: 90;
        }

        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                transform: translateX(-100%);
                box-shadow: 2px 0 16px rgba(0, 0, 0, 0.08);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.active {
                display: block;
            }
            .mobile-header {
                display: flex;
            }
            .iframe-wrap {
                height: calc(100vh - 44px);
            }
        }
    </style>
</head>
<body>
    <div class="portal-wrapper">
        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

        <!-- Minimal White Sidebar -->
        <aside class="sidebar" id="portalSidebar">
            <div class="sidebar-header">
                <h1 class="course-title">Advanced Spatial Statistics</h1>
                <p class="course-subtitle">Theory &amp; Practical Application</p>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-category">Course Overview</div>
                
                <!-- 1. Presentation Slides (Default Landing Page) -->
                <div class="nav-item active" id="nav-presentation" onclick="switchView('presentation', 'presentation.html', 'Lecture Slides')">
                    <span class="nav-icon">📊</span>
                    <span>Lecture Slides</span>
                </div>

                <!-- 2. Master Decision Handbook -->
                <div class="nav-item" id="nav-handbook" onclick="switchView('handbook', 'notebooks_html/00_master_spatial_decision_handbook.html', 'Master Decision Handbook')">
                    <span class="nav-icon">📖</span>
                    <span>Master Handbook</span>
                </div>

                <div class="nav-category">Lessons</div>

                <!-- 3. Module 01: ESDA -->
                <div class="nav-item" id="nav-01_esda" onclick="switchView('01_esda', 'notebooks_html/01_exploratory_spatial_data_analysis.html', 'Lesson 01: ESDA &amp; Autocorrelation')">
                    <span class="nav-icon">🗺️</span>
                    <span>01: ESDA &amp; Autocorrelation</span>
                </div>

                <!-- 4. Module 02: Spatial Modeling & VIF -->
                <div class="nav-item" id="nav-02_modeling" onclick="switchView('02_modeling', 'notebooks_html/02_spatial_statistics_modeling.html', 'Lesson 02: Spatial Econometrics')">
                    <span class="nav-icon">📐</span>
                    <span>02: Spatial Econometrics</span>
                </div>

                <!-- 5. Module 03: Decision Intelligence -->
                <div class="nav-item" id="nav-03_sectoral" onclick="switchView('03_sectoral', 'notebooks_html/03_sectoral_decision_intelligence.html', 'Lesson 03: Decision Intelligence')">
                    <span class="nav-icon">🎯</span>
                    <span>03: Decision Engines</span>
                </div>
            </nav>
        </aside>

        <!-- Main Viewport (Clean, Minimal) -->
        <main class="content-pane">
            <!-- Mobile Toggle Header (Visible Only on Small Screens) -->
            <div class="mobile-header">
                <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle Navigation">
                    ☰
                </button>
                <span class="mobile-title" id="mobileTitle">Lecture Slides</span>
            </div>

            <!-- Frame Container (100% Height on Desktop) -->
            <div class="iframe-wrap" id="frameWrapper">
                <iframe src="presentation.html" id="mainFrame" class="view-frame" title="Course Viewer"></iframe>
            </div>
        </main>
    </div>

    <script>
        const views = {
            'presentation': {
                url: 'presentation.html',
                title: 'Lecture Slides'
            },
            'handbook': {
                url: 'notebooks_html/00_master_spatial_decision_handbook.html',
                title: 'Master Decision Handbook'
            },
            '01_esda': {
                url: 'notebooks_html/01_exploratory_spatial_data_analysis.html',
                title: 'Lesson 01: ESDA & Autocorrelation'
            },
            '02_modeling': {
                url: 'notebooks_html/02_spatial_statistics_modeling.html',
                title: 'Lesson 02: Spatial Econometrics'
            },
            '03_sectoral': {
                url: 'notebooks_html/03_sectoral_decision_intelligence.html',
                title: 'Lesson 03: Decision Intelligence'
            }
        };

        function switchView(key, url, title) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById('nav-' + key);
            if (activeEl) activeEl.classList.add('active');

            const mobileTitle = document.getElementById('mobileTitle');
            if (mobileTitle) mobileTitle.innerText = title;

            const frame = document.getElementById('mainFrame');
            if (frame.src !== url && !frame.src.endsWith('/' + url)) {
                frame.src = url;
            }

            history.replaceState(null, null, '#' + key);

            if (window.innerWidth <= 992) {
                toggleSidebar(false);
            }
        }

        function toggleSidebar(forceState) {
            const sidebar = document.getElementById('portalSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (typeof forceState === 'boolean') {
                sidebar.classList.toggle('open', forceState);
                overlay.classList.toggle('active', forceState);
            } else {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            if (hash && views[hash]) {
                const v = views[hash];
                switchView(hash, v.url, v.title);
            } else {
                // Default first landing page: Lecture Slides
                switchView('presentation', 'presentation.html', 'Lecture Slides');
            }
        });
    </script>
</body>
</html>
